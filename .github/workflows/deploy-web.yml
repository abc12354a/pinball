# Builds the web (H5) version and publishes it to GitHub Pages on every push to main.
# Requires repo Settings -> Pages -> Source: "GitHub Actions"
# (auto-enabled by configure-pages with enablement: true on first run).
# Site: https://abc12354a.github.io/pinball/
name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:h5
      - uses: actions/configure-pages@v5
        with:
          # auto-enable GitHub Pages on first run
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
